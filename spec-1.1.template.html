<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="{{description}}">
<title>{{title}} v{{version}}</title>
<style>
  :root {
    --bg: #fbfaf7;
    --bg-elev: #ffffff;
    --bg-sunken: #f2f1ec;
    --fg: #17191c;
    --fg-soft: #3b4047;
    --muted: #6d7279;
    --line: #e3e0d8;
    --line-strong: #cbc7bc;
    --accent: #2d4fce;
    --accent-soft: #eef1fd;
    --code-bg: #f4f3ee;
    --code-head: #eeece5;
    --code-fg: #23262b;
    --note-bg: #f1f4fe;
    --note-edge: #2d4fce;
    --radius: 10px;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101216;
      --bg-elev: #171a1f;
      --bg-sunken: #1a1e24;
      --fg: #eceef1;
      --fg-soft: #c3c8d0;
      --muted: #8f96a1;
      --line: #272c34;
      --line-strong: #3a414c;
      --accent: #9ab5ff;
      --accent-soft: #1a2337;
      --code-bg: #15181d;
      --code-head: #1a1e24;
      --code-fg: #d9dee6;
      --note-bg: #161d2b;
      --note-edge: #6f92ff;
    }
  }
  *, *::before, *::after { box-sizing: border-box; }
  html {
    -webkit-text-size-adjust: 100%;
    -moz-text-size-adjust: 100%;
  }
  @media (prefers-reduced-motion: no-preference) {
    html { scroll-behavior: smooth; }
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg-soft);
    font: 400 16.5px/1.68 var(--sans);
    text-rendering: optimizeLegibility;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--accent); color: var(--bg-elev); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 3px; }
  a { color: var(--accent); text-decoration-thickness: .07em; text-underline-offset: .18em; }
  a:hover { text-decoration: underline; }

  /* ---------- top bar ---------- */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    border-bottom: 1px solid var(--line);
    background: var(--bg);
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .topbar-inner {
    max-width: 60rem;
    margin: 0 auto;
    padding: .65rem 1.75rem;
    display: flex;
    align-items: center;
    gap: .75rem;
  }
  .brand {
    display: inline-flex;
    align-items: center;
    gap: .6rem;
    color: var(--fg);
    text-decoration: none;
  }
  .brand:hover { text-decoration: none; }
  .brand-mark {
    display: grid;
    place-items: center;
    width: 1.55rem;
    height: 1.55rem;
    border-radius: 6px;
    background: var(--accent);
    color: var(--bg-elev);
    font: 700 .8rem/1 var(--mono);
  }
  .brand-name {
    font: 600 .76rem/1 var(--sans);
    letter-spacing: .12em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .chip {
    margin-left: auto;
    padding: .25rem .55rem;
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    color: var(--muted);
    font: 600 .68rem/1 var(--mono);
    letter-spacing: .06em;
    white-space: nowrap;
  }

  /* ---------- page shell ---------- */
  .page {
    max-width: 60rem;
    margin: 0 auto;
    padding: 0 1.75rem;
  }
  .layout {
    display: grid;
    grid-template-columns: 13.5rem minmax(0, 41rem);
    column-gap: 4.25rem;
    align-items: start;
    padding-bottom: 4.5rem;
  }

  /* ---------- hero ---------- */
  .hero { padding: 4.5rem 0 2.8rem; }
  .eyebrow {
    margin: 0 0 1.1rem;
    color: var(--accent);
    font: 650 .7rem/1 var(--sans);
    letter-spacing: .18em;
    text-transform: uppercase;
  }
  h1 {
    margin: 0;
    color: var(--fg);
    font-size: clamp(2rem, 4.2vw, 2.9rem);
    line-height: 1.06;
    letter-spacing: -.025em;
    font-weight: 680;
    text-wrap: balance;
  }
  .release {
    display: inline-block;
    margin: 1.2rem 0 1.1rem;
    padding: .32rem .7rem;
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    color: var(--muted);
    font: 600 .7rem/1 var(--mono);
    letter-spacing: .08em;
    text-transform: uppercase;
  }
  .lede {
    margin: 0;
    max-width: 44rem;
    color: var(--fg-soft);
    font-size: 1.08rem;
    line-height: 1.62;
  }

  /* ---------- contents sidebar ---------- */
  .toc {
    position: sticky;
    top: 4.5rem;
    max-height: calc(100vh - 7rem);
    overflow-y: auto;
    padding: 0 0 1rem;
    font-size: .86rem;
    line-height: 1.4;
  }
  .toc-title {
    margin: 0 0 .7rem;
    color: var(--muted);
    font: 650 .67rem/1 var(--sans);
    letter-spacing: .16em;
    text-transform: uppercase;
  }
  .toc ol, .toc ul {
    margin: 0;
    padding: 0;
    list-style: none;
  }
  .toc .appendix {
    margin-top: 1rem;
    padding-top: 1rem;
    border-top: 1px solid var(--line);
  }
  .toc ol > li > a { counter-increment: section; }
  .toc ol { counter-reset: section; }
  .toc ol > li > a::before {
    content: counter(section) ".";
    display: inline-block;
    min-width: 1.5em;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .toc a {
    display: block;
    padding: .24rem .5rem .24rem .55rem;
    border-left: 2px solid transparent;
    border-radius: 0 5px 5px 0;
    color: var(--muted);
    text-decoration: none;
    transition: color .12s ease, background-color .12s ease;
  }
  .toc a:hover {
    background: var(--bg-sunken);
    color: var(--fg);
  }
  .toc a.active {
    border-left-color: var(--accent);
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 600;
  }
  @media (prefers-reduced-motion: reduce) {
    .toc a { transition: none; }
  }

  /* ---------- headings ---------- */
  h2 {
    position: relative;
    margin: 3.4rem 0 1rem;
    padding-top: 1.3rem;
    border-top: 1px solid var(--line);
    color: var(--fg);
    font-size: 1.45rem;
    line-height: 1.25;
    letter-spacing: -.015em;
    font-weight: 660;
    text-wrap: balance;
    scroll-margin-top: 3.75rem;
  }
  h2::before {
    content: "";
    position: absolute;
    top: -1px;
    left: 0;
    width: 3rem;
    height: 2px;
    background: var(--accent);
  }
  h3 {
    margin: 2rem 0 .55rem;
    color: var(--fg);
    font-size: 1.01rem;
    line-height: 1.4;
    font-weight: 650;
    scroll-margin-top: 3.75rem;
  }
  li[id] { scroll-margin-top: 3.5rem; }

  /* ---------- prose ---------- */
  p { margin: 0 0 1rem; }
  strong { color: var(--fg); font-weight: 640; }
  ul, ol { margin: .6rem 0 1.15rem; padding-left: 1.35rem; }
  li { margin: .32rem 0; padding-left: .1rem; }
  li::marker { color: var(--muted); }
  li > ul, li > ol { margin: .35rem 0 .4rem; }

  /* ---------- code ---------- */
  code {
    font-family: var(--mono);
    font-size: .87em;
    color: var(--code-fg);
    background: var(--code-bg);
    padding: .1em .34em;
    border-radius: 5px;
    overflow-wrap: break-word;
  }
  pre code { background: none; padding: 0; border-radius: 0; font-size: inherit; color: inherit; }
  pre { margin: 0; }

  .code {
    margin: 1.3rem 0;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--code-bg);
    overflow: hidden;
  }
  .code[data-lang]::before {
    content: attr(data-lang);
    display: block;
    padding: .5rem 1.1rem;
    border-bottom: 1px solid var(--line);
    background: var(--code-head);
    color: var(--muted);
    font: 650 .66rem/1 var(--mono);
    letter-spacing: .1em;
    text-transform: uppercase;
  }
  .code pre {
    padding: 1rem 1.15rem;
    overflow-x: auto;
    font: .84rem/1.58 var(--mono);
    color: var(--code-fg);
    tab-size: 4;
  }

  /* ---------- directory tree ---------- */
  .tree-figure { margin: 1.3rem 0; }
  .tree {
    padding: 1.1rem 1.2rem;
    overflow-x: auto;
    background: var(--code-bg);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    color: var(--code-fg);
    font: .84rem/1.75 var(--mono);
    white-space: pre;
  }
  .tree .t-root { color: var(--fg); font-weight: 600; }
  .tree .t-c { color: var(--muted); }

  /* ---------- tables ---------- */
  .table-wrap { margin: 1.3rem 0; overflow-x: auto; }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: .92rem;
    line-height: 1.5;
  }
  th, td {
    padding: .55rem .7rem;
    text-align: left;
    vertical-align: top;
    border-bottom: 1px solid var(--line);
  }
  th:first-child, td:first-child { padding-left: 0; }
  th:last-child, td:last-child { padding-right: 0; }
  thead th {
    border-bottom: 1px solid var(--line-strong);
    color: var(--muted);
    font: 650 .68rem/1.3 var(--sans);
    letter-spacing: .1em;
    text-transform: uppercase;
  }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:hover { background: var(--bg-sunken); }
  table.mono td:first-child,
  table.mono th:first-child { font-family: var(--mono); font-size: .88em; }
  td code { white-space: nowrap; }

  /* ---------- notes ---------- */
  .note {
    margin: 1.6rem 0;
    padding: .95rem 1.2rem 1rem;
    border-left: 3px solid var(--note-edge);
    border-radius: 0 var(--radius) var(--radius) 0;
    background: var(--note-bg);
    font-size: .95rem;
  }
  .note::before {
    content: "Note";
    display: block;
    margin-bottom: .6rem;
    color: var(--accent);
    font: 700 .64rem/1 var(--sans);
    letter-spacing: .16em;
    text-transform: uppercase;
  }
  .note p { margin: 0 0 .65rem; }
  .note p:last-child { margin-bottom: 0; }
  .note code { background: color-mix(in srgb, var(--bg-elev) 55%, transparent); }

  /* ---------- cross references ---------- */
  a.xref {
    color: inherit;
    text-decoration: underline;
    text-decoration-color: var(--line-strong);
    text-decoration-thickness: .05em;
    text-underline-offset: .18em;
  }
  a.xref:hover { color: var(--accent); text-decoration-color: var(--accent); text-decoration-thickness: .06em; }

  /* ---------- separators & footer ---------- */
  .footer {
    margin-top: 3.5rem;
    padding-top: 1.2rem;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: .83rem;
  }
  .footer p { margin: 0 0 .6rem; }
  .footer a { color: var(--muted); text-decoration: none; }
  .footer a:hover { color: var(--accent); }

  /* ---------- narrow screens ---------- */
  @media (max-width: 899px) {
    .layout {
      grid-template-columns: minmax(0, 1fr);
      padding-bottom: 0;
    }
    .toc {
      position: static;
      max-height: none;
      overflow: visible;
      margin: 0 0 2.5rem;
      padding: 0 0 1.25rem;
      border-bottom: 1px solid var(--line);
    }
    .toc ol, .toc ul { columns: 2; column-gap: 2rem; }
    .toc .appendix {
      margin-top: 0;
      padding-top: 0;
      border-top: 0;
    }
    .toc li { break-inside: avoid; }
    h2 { scroll-margin-top: 1rem; }
    h3 { scroll-margin-top: 1rem; }
    li[id] { scroll-margin-top: 1rem; }
  }
  @media (max-width: 640px) {
    .page { padding: 0 1.25rem; }
    .topbar-inner { padding: .6rem 1.25rem; }
    .hero { padding: 3rem 0 2rem; }
    .toc ol, .toc ul { columns: 1; }
  }
  @media (max-width: 420px) {
    body { font-size: 16px; }
    h1 { font-size: 1.8rem; }
  }

  /* ---------- print ---------- */
  @media print {
    :root {
      --bg: #fff;
      --bg-elev: #fff;
      --bg-sunken: #f7f7f7;
      --fg: #000;
      --fg-soft: #1c1c1c;
      --muted: #555;
      --line: #ccc;
      --line-strong: #999;
      --accent: #000;
      --code-bg: #f6f6f6;
      --code-head: #f0f0f0;
      --note-bg: #f7f7f7;
      --note-edge: #999;
    }
    body { font-size: 10.5pt; }
    .topbar { display: none; }
    .page { max-width: none; padding: 0; }
    .layout { display: block; padding: 0; }
    .toc { display: none; }
    .hero { padding-top: 0; }
    a { color: inherit; text-decoration: none; }
    h2, h3 { break-after: avoid; }
    .code, .tree, table, .note, .toc { break-inside: avoid; }
  }
</style>
</head>
<body id="top">

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#top">
      <span class="brand-mark" aria-hidden="true">A</span>
      <span class="brand-name">{{short_title}}</span>
    </a>
    <span class="chip">v{{version}}</span>
  </div>
</header>

<div class="page">

  <header class="hero">
    <p class="eyebrow">{{eyebrow}}</p>
    <h1>{{title}}</h1>
    <p class="release">Version {{version}}</p>
    <p class="lede">{{lede}}</p>
  </header>

  <div class="layout">

    <nav class="toc" aria-label="Contents">
{{toc}}
    </nav>

    <article>

{{content}}

    <footer class="footer">
      <p>{{title}} — Version {{version}}. Self-contained HTML; no external assets. Save this page and open it offline.</p>
      <p><a href="#top">Back to top &uarr;</a></p>
    </footer>

    </article>
  </div>
</div>

<script>
  // Marks the section currently at the top of the viewport in the table of contents.
  (function () {
    var links = document.querySelectorAll('nav.toc a[href^="#"]');
    var sections = [];

    for (var i = 0; i < links.length; i++) {
      var link = links[i];
      var section = document.getElementById(link.getAttribute('href').slice(1));
      if (section) sections.push({ link: link, section: section });
    }
    if (!sections.length) return;

    var current = null;
    var queued = false;

    function mark() {
      // The reading line sits a little below the top edge of the viewport.
      var line = 120;
      var active = sections[0];

      for (var i = 0; i < sections.length; i++) {
        if (sections[i].section.getBoundingClientRect().top <= line) {
          active = sections[i];
        }
      }

      // At the very bottom, the last section is what the reader is looking at.
      if (window.innerHeight + window.scrollY >= document.body.scrollHeight - 2) {
        active = sections[sections.length - 1];
      }

      if (active === current) return;
      if (current) {
        current.link.classList.remove('active');
        current.link.removeAttribute('aria-current');
      }
      active.link.classList.add('active');
      active.link.setAttribute('aria-current', 'true');
      current = active;
    }

    function onScroll() {
      if (queued) return;
      queued = true;
      window.requestAnimationFrame(function () {
        mark();
        queued = false;
      });
    }

    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll);
    mark();
  })();
</script>

</body>
</html>
